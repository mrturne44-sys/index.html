<style>
/* ===== 1. TOKENS : l'accent change de spectre selon la zone ===== */
@property --a{syntax:"<color>";inherits:true;initial-value:#8b5cf6}
@property --b{syntax:"<color>";inherits:true;initial-value:#2f7dff}
:root{--bg:#05040b;--ink:#efedff;--mut:#9a98c6;--line:#241f4a;--a:#8b5cf6;--b:#2f7dff;--mx:0;--my:0;--sy:0;

[data-z=technologie]{--a:#2f7dff;--b:#35d8ff}

/* ===== 2. BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.65 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;opacity:.3;
  background:radial-gradient(60vmax 40vmax at 92% -10%,var(--a),transparent 70%),radial-gradient(50vmax 40vmax at -10% 65%,var(--b),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/80px 80px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/80px 80px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 75%)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #35d8ff;outline-offset:3px}
.wrap{width:min(1200px,100% - 36px);margin-inline:auto}
.skip{position:fixed;left:12px;top:-60px;z-index:100;background:#fff;color:#000;padding:8px 14px;border-radius:8px;border:0}
.skip:focus{top:12px}
.big{font:900 clamp(2.6rem,10vw,7.5rem)/.92 var(--disp);letter-spacing:-.045em}
.grad{background:linear-gradient(110deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);max-width:520px}

header{position:fixed;inset:0 0 auto;z-index:50;padding:14px 0;transition:.3s}

nav{display:flex;gap:2px}

nav a:hover,nav a.on{color:#fff;background:#ffffff14}
.tools{display:flex;gap:8px}
.ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#ffffff08;cursor:pointer;transition:.25s}
.ic:hover{border-color:var(--a);box-shadow:0 0 18px -4px var(--a)}
#mb{display:none}
@media(max-width:820px){

}

/* ===== 4. BOUTONS ET CURSEUR ===== */
.btn{position:relative;display:inline-flex;align-items:center;padding:14px 28px;border:0;border-radius:99px;cursor:pointer;overflow:hidden;font-weight:700;color:#fff;

.btn::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;transform:translateX(-101%) skewX(-20deg);transition:transform .55s,opacity .55s}
.btn:hover::before{opacity:.2;transform:translateX(101%) skewX(-20deg)}
.btn:hover{box-shadow:0 14px 40px -8px var(--a)}
.btn span{position:relative}
.ring{position:fixed;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--a);border-radius:50%;pointer-events:none;z-index:99;opacity:0;transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}
.ring.big{width:70px;height:70px;margin:-35px 0 0 -35px;background:#ffffff14}

/* ===== 5. HÉROS ===== */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:120px 0 7vh;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%}
.hc{position:relative;transform:translate3d(0,calc(var(--sy)*.22px),0);opacity:calc(1 - var(--sy)/760)}
.hero h1{font:900 clamp(3.4rem,18vw,14rem)/.84 var(--disp);letter-spacing:-.055em}

.hero h1 i{display:inline-block;font-style:normal;transform:translateY(112%) rotate(6deg);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*70ms + .15s)}
.hero .w2{padding-left:9vw;-webkit-text-stroke:2px var(--a);color:transparent}
@keyframes up{to{transform:none}}
.lead{margin:28px 0 26px;max-width:460px;color:var(--mut);font-size:1.1rem}
.fl{position:absolute;right:5vw;z-index:2;translate:calc(var(--mx)*var(--d)*1px) calc(var(--my)*var(--d)*1px)}
.fl a{display:block;padding:16px 22px;border-radius:18px;border:1px solid #ffffff2b;background:#ffffff0d;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-weight:700;animation:fl 6s ease-in-out infinite;transition:border-color .3s,background .3s}
.fl a:hover{border-color:var(--a);background:#ffffff1c}
.fl small{display:block;color:var(--mut);font-weight:400}
.f1{top:22%;--d:30}.f2{top:42%;right:15vw;--d:-22}.f2 a{animation-delay:-2s}.f3{top:62%;--d:16}.f3 a{animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-14px) rotate(-1.5deg)}}
@media(max-width:820px){.fl{position:static;translate:none;display:inline-block;margin:0 8px 8px 0}.fl a{padding:10px 16px}.fl small{display:none}.flw{margin-top:26px}}
@media(min-width:821px){.flw{display:contents}}

.mq span::after{content:"";width:.4em;height:.4em;background:var(--a);rotate:45deg}
@keyframes mq{to{transform:translateX(-50%)}}
.sec{padding:clamp(60px,10vw,130px) 0}
.manif{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:end}
.stats{display:grid;gap:22px}
.stat{border-left:2px solid var(--a);padding-left:20px}
.stat b{display:block;font:900 clamp(2.4rem,6vw,4rem)/1 var(--disp)}
.stat span{color:var(--mut)}
@media(max-width:820px){.manif{grid-template-columns:1fr}}

/* ===== 7. ZONES (accordéon immersif) ===== */
.zones{display:flex;gap:10px;height:min(72vh,580px);margin-top:36px}

.zbg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center;transition:transform 1s,opacity .5s;opacity:.55}
.zone.open .zbg{transform:scale(1.06);opacity:.9}
.zone::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,#05040bf0,transparent 65%)}
.vt{position:absolute;inset:0;width:100%;border:0;background:none;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding:26px 0}
.vt span{writing-mode:vertical-rl;rotate:180deg;font:900 2.4rem var(--disp);letter-spacing:-.02em;transition:opacity .3s}
.zone.open .vt span{opacity:0}
.bd{position:absolute;left:0;right:0;bottom:0;padding:30px;opacity:0;visibility:hidden;transform:translateY(20px);transition:.5s .15s}
.zone.open .bd{opacity:1;visibility:visible;transform:none}
.bd h3{font:900 clamp(2.2rem,5vw,4rem)/1 var(--disp);letter-spacing:-.04em;margin-bottom:8px}
.bd p{color:#cfcdf0;max-width:380px;margin-bottom:18px}
@media(max-width:820px){
  .zones{flex-direction:column;height:auto}
  .zone{flex:none;height:92px;transition:height .6s cubic-bezier(.7,0,.2,1),border-color .4s}
  .zone.open{height:340px}
  .vt{align-items:center;justify-content:flex-start;padding:0 24px}.vt span{writing-mode:horizontal-tb;rotate:none}
}

/* ===== 8. CARTES ET LISTES ===== */
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.rv{opacity:0;translate:0 34px;transition:opacity .9s,translate .9s}
.rv.in{opacity:1;translate:0 0}
.card{display:block;position:relative;border-radius:20px;overflow:hidden;background:#0d0b1f;border:1px solid var(--line);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,border-color .3s,opacity .9s,translate .9s}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px at var(--gx,50%) var(--gy,0%),#ffffff22,transparent)}
.card:hover{border-color:var(--a)}.card:hover::after{opacity:1}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card div{padding:18px 20px 22px}
.tag{display:inline-block;font-size:.8rem;padding:2px 12px;border-radius:99px;border:1px solid var(--a);margin-bottom:10px}
.card h3{font-size:1.15rem;line-height:1.3;margin-bottom:6px}
.card p{color:var(--mut);font-size:.93rem}
.meta{display:block;margin-top:12px;font-size:.82rem;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 34px}
.chip{padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--mut);transition:.25s}

.chip[aria-pressed=true]{background:linear-gradient(120deg,var(--a),var(--b));color:#fff;border-color:transparent}
#q{width:min(100%,520px);padding:15px 22px;border-radius:99px;border:1px solid var(--line);background:#ffffff08;color:var(--ink);font:inherit;font-size:1.05rem;margin-top:22px}
#q:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px #8b5cf633}
.empty{padding:50px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:20px}
.page{padding-top:140px}

.gh{font:900 clamp(1.8rem,5vw,3rem)/1 var(--disp);letter-spacing:-.03em;margin:10px 0 10px}
.gate{margin-bottom:64px}
.lk{display:block;margin-top:10px;padding:11px 16px;border-radius:12px;border:1px solid var(--a);text-align:center;font-weight:600;transition:background .25s,border-color .25s}
.lk:hover{background:linear-gradient(120deg,var(--a),var(--b));border-color:transparent}

/* ===== 9. ARTICLE ===== */
#prog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;transform:scaleX(0);transform-origin:0;background:linear-gradient(90deg,var(--a),var(--b))}
.post{max-width:760px;margin:0 auto}
.post h1{font:900 clamp(2.2rem,7vw,4.4rem)/1 var(--disp);letter-spacing:-.04em;margin:16px 0}
.post img{width:100%;border-radius:22px;margin:28px 0;border:1px solid var(--line)}
.post p{font-size:1.12rem;margin-bottom:1.2em;color:#dcdaf7}

/* ===== 10. PIED DE PAGE, TRANSITION, MOUVEMENT ===== */
footer{border-top:1px solid var(--line);padding:70px 0 30px;margin-top:40px;overflow:hidden}
.fw{font:900 clamp(2.6rem,14.5vw,12rem)/.9 var(--disp);letter-spacing:-.06em;white-space:nowrap}

.fr nav a{font:inherit;padding:7px 14px;letter-spacing:0}
.copy{color:var(--mut);font-size:.88rem}
.cur{position:fixed;inset:0;z-index:90;pointer-events:none;background:linear-gradient(120deg,var(--a),var(--b));transform:translateY(100%)}
.cur.go{animation:wipe .75s cubic-bezier(.7,0,.2,1)}
@keyframes wipe{0%{transform:translateY(100%)}45%,55%{transform:none}100%{transform:translateY(-100%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rv{opacity:1;translate:none}.hero h1 i{transform:none}}
</style>

<script>
/* ===== A. DONNÉES ===== */
const PAGES=[["accueil","Accueil"],["gaming","Gaming"],["anime","Anime"],["technologie","Technologie"],["articles","Articles"]];
const Z={
  gaming:{l:"Gaming",i:"🎮",a:"#8b5cf6",b:"#2f7dff",t:"Guides, astuces et compétition : jouer mieux, même avec peu de moyens."},
  anime:{l:"Anime",i:"⛩️",a:"#c15cff",b:"#7a5cff",t:"Séries, dossiers et découvertes pour ne plus jamais manquer d'épisodes."},
  technologie:{l:"Technologie",i:"⚡",a:"#2f7dff",b:"#35d8ff",t:"Smartphones, IA et réflexes numériques pour faire plus avec moins."}
};

/* Passerelle : fiches animés et jeux. Pour en ajouter : copier une ligne, changer id, cat, n (nom), d (résumé), s (mot cherché sur les plateformes officielles). */
const C=[
 {id:"naruto",cat:"anime",n:"Naruto",d:"Un jeune ninja rêve de devenir le chef de son village. Amitié, effort et combats épiques.",s:"Naruto"},
 {id:"dragon-ball",cat:"anime",n:"Dragon Ball",d:"Les aventures de Goku, des arts martiaux aux combats cosmiques, avec des boules magiques à rassembler.",s:"Dragon Ball"},
 {id:"one-piece",cat:"anime",n:"One Piece",d:"Luffy et son équipage naviguent à la recherche d'un trésor légendaire.",s:"One Piece"},
 {id:"demon-slayer",cat:"anime",n:"Demon Slayer",d:"Tanjiro devient chasseur de démons pour sauver sa sœur.",s:"Demon Slayer"},
 {id:"free-fire",cat:"gaming",n:"Free Fire",d:"Un battle royale rapide, pensé pour les téléphones.",s:"Free Fire"},
 {id:"roblox",cat:"gaming",n:"Roblox",d:"Une plateforme de jeux créés par les joueurs eux-mêmes.",s:"Roblox"},
 {id:"cod-mobile",cat:"gaming",n:"Call of Duty Mobile",d:"Tir à la première personne et battle royale sur mobile.",s:"Call of Duty Mobile"},
 {id:"minecraft",cat:"gaming",n:"Minecraft",d:"Construire, explorer et survivre dans un monde de blocs.",s:"Minecraft"}
];
const U=encodeURIComponent;
// Les boutons ouvrent la recherche sur des plateformes officielles : le site n'héberge aucun épisode ni aucun jeu.
function gate(k){
  const l=C.filter(c=>c.cat===k);if(!l.length)return "";
  const L=c=>k==="anime"
    ?[["Chercher sur Crunchyroll","https://www.crunchyroll.com/search?q="+U(c.s)],["Chaîne officielle (YouTube)","https://www.youtube.com/results?search_query="+U(c.s+" officiel")]]
    :[["Voir sur Google Play","https://play.google.com/store/search?q="+U(c.s)+"&c=apps"],["Bande-annonce officielle","https://www.youtube.com/results?search_query="+U(c.s+" trailer officiel")]];
  return `<h2 class="gh rv">${k==="anime"?"Où regarder":"Où télécharger"}</h2>
    <p class="sub" style="margin-bottom:22px">NEXORA ZONE ne contient aucun épisode ni aucun jeu. Chaque bouton t'envoie vers une plateforme officielle. La gratuité dépend de ton pays et de la plateforme.</p>
    <div class="grid gate">${l.map(c=>`<div class="card rv" style="--a:${Z[k].a};--b:${Z[k].b}"><img src="${cover({id:c.id,cat:k})}" alt="" loading="lazy" width="640" height="360"><div><h3>${c.n}</h3><p>${c.d}</p>${L(c).map(([t,h])=>`<a class="lk" href="${h}" target="_blank" rel="noopener noreferrer">${t}</a>`).join("")}</div></div>`).join("")}</div>
    <h2 class="gh rv">Articles</h2>`;
}

/* ===== B. OUTILS ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const FINE=matchMedia("(hover:hover) and (pointer:fine)").matches, RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const root=document.documentElement, app=$("#app");
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const fmt=d=>new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
const split=s=>[...s].map((c,i)=>`<i style="--i:${i}">${c}</i>`).join("");
// Images de démonstration en SVG : zéro téléchargement.
function cover(a){
  const z=Z[a.cat],s=[...a.id].reduce((n,c)=>n+c.charCodeAt(0),0),x=100+s%440;
  const g=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${z.b}' stop-opacity='.55'/><stop offset='1' stop-color='#05040b'/></linearGradient><radialGradient id='r'><stop offset='0' stop-color='${z.a}'/><stop offset='1' stop-color='${z.a}' stop-opacity='0'/></radialGradient></defs><rect width='640' height='360' fill='url(#g)'/><circle cx='${x}' cy='${120+s%140}' r='180' fill='url(#r)' opacity='.8'/><path d='M0 ${250-s%60}L640 ${130+s%90}' stroke='${z.b}' stroke-opacity='.55' stroke-width='2'/><path d='M0 ${295-s%60}L640 ${175+s%90}' stroke='${z.a}' stroke-opacity='.35' stroke-width='2'/><text x='${200+s%240}' y='235' font-size='120' text-anchor='middle'>${z.i}</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(g);
}
const card=a=>`<a class="card rv" href="#article-${a.id}" style="--a:${Z[a.cat].a};--b:${Z[a.cat].b}">
  <img src="${cover(a)}" alt="" loading="lazy" width="640" height="360">
  <div><span class="tag">${Z[a.cat].l}</span><h3>${a.t}</h3><p>${a.d}</p><span class="meta">${fmt(a.date)}, ${a.m} min de lecture</span></div></a>`;
const grid=l=>l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<p class="empty">Aucun article ne correspond. Essayez un autre mot-clé.</p>`;
const latest=()=>[...A].sort((a,b)=>b.date.localeCompare(a.date));

/* ===== C. VUES ===== */
function home(){
  const mins=A.reduce((n,a)=>n+a.m,0);
  const words=[...Object.values(Z).map(z=>z.l),"Esports","Mobile","IA"];
  const mq=words.map(w=>`<span>${w}</span>`).join("");
  return `<section class="hero" id="hero"><canvas id="fx" aria-hidden="true"></canvas>
    <div class="wrap" style="width:min(1200px,100% - 36px)"><div class="hc">
      <h1 aria-label="NEXORA ZONE"><b aria-hidden="true">${split("NEXORA")}</b><b class="w2" aria-hidden="true">${split("ZONE")}</b></h1>
      <p class="lead">Gaming, animés, technologie. Un seul signal, trois zones à explorer.</p>
      <a class="btn" href="#articles"><span>Entrer dans la zone</span></a>
      <div class="flw">${Object.entries(Z).map(([k,z],i)=>`<div class="fl f${i+1}" style="--a:${z.a};--b:${z.b}"><a href="#${k}">${z.i} ${z.l}<small>Explorer la zone</small></a></div>`).join("")}</div>
    </div></div></section>
  <div class="mq" aria-hidden="true"><div>${mq+mq+mq+mq}</div></div>
  <section class="sec"><div class="wrap manif">
    <div class="rv"><h2 class="big">Trois zones.<br><span class="grad">Un seul signal.</span></h2></div>
    <div class="stats">
      <div class="stat rv"><b data-n="${A.length}">0</b><span>articles à lire</span></div>
      <div class="stat rv"><b data-n="${mins}">0</b><span>minutes de lecture au total</span></div>
      <div class="stat rv"><b data-n="3">0</b><span>zones à explorer</span></div>
    </div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><h2 class="big rv">Choisis ta zone</h2>
    <div class="zones rv">${Object.entries(Z).map(([k,z],i)=>`<div class="zone${i?"":" open"}" data-z="${k}">
      <div class="zbg" style="background-image:url('${cover({id:k,cat:k})}')"></div>
      <button class="vt" aria-expanded="${i?"false":"true"}"><span>${z.l}</span></button>
      <div class="bd"><h3>${z.l}</h3><p>${z.t}</p><a class="btn" href="#${k}"><span>Voir les articles</span></a></div></div>`).join("")}</div></div></section>
  <section class="sec" style="padding-top:0"><div class="wrap">
    <div class="head"><h2 class="big rv">Dernières<br>publications</h2><a class="btn" href="#articles"><span>Tout voir</span></a></div>
    ${grid(latest().slice(0,6))}</div></section>`;
}
function zonePage(k){
  const z=Z[k];
  return `<section class="page sec"><div class="wrap"><h1 class="big"><span class="grad">${z.l}</span></h1>
    <p class="sub" style="margin:18px 0 44px">${z.t}</p>${gate(k)}${grid(A.filter(a=>a.cat===k))}</div></section>`;
}
let query="",filter="tous",focusQ=false;
function articlesPage(){
  const chips=[["tous","Tous"],...Object.entries(Z).map(([k,z])=>[k,z.l])].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
  return `<section class="page sec"><div class="wrap"><h1 class="big">Tous les <span class="grad">articles</span></h1>
    <input id="q" type="search" placeholder="Rechercher un titre, un sujet…" aria-label="Rechercher un article" autocomplete="off" value="${query.replace(/"/g,"&quot;")}">
    <div class="chips" role="group" aria-label="Filtrer par catégorie">${chips}</div>
    <p class="sub" id="cnt" aria-live="polite" style="margin-bottom:24px"></p><div id="res"></div></div></section>`;
}
function results(){
  const q=norm(query.trim());
  const l=latest().filter(a=>(filter==="tous"||a.cat===filter)&&(!q||norm([a.t,a.d,Z[a.cat].l,...a.b].join(" ")).includes(q)));
  $("#cnt").textContent=l.length+(l.length>1?" articles":" article")+(q?` pour « ${query.trim()} »`:"");
  $("#res").innerHTML=grid(l);
  $$(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===filter));
  reveal();
}
function articlePage(a){
  const more=A.filter(x=>x.cat===a.cat&&x.id!==a.id);
  return `<div id="prog" aria-hidden="true"></div><article class="page sec"><div class="wrap"><div class="post">
    <a class="tag" href="#${a.cat}">${Z[a.cat].l}</a><h1>${a.t}</h1><p class="meta">${fmt(a.date)}, ${a.m} min de lecture</p>
    <img src="${cover(a)}" alt="" width="640" height="360">${a.b.map(p=>`<p>${p}</p>`).join("")}
    <button class="btn" id="cp"><span>Copier le lien</span></button></div></div></article>
    ${more.length?`<section class="sec" style="padding-top:0"><div class="wrap"><h2 class="big rv" style="font-size:clamp(2rem,6vw,4rem);margin-bottom:30px">À lire aussi</h2>${grid(more)}</div></section>`:""}`;
}

/* ===== D. EFFETS ===== */
function reveal(){
  const count=(el,n)=>{if(RM){el.textContent=n;return}const t0=performance.now();(function f(t){const p=Math.min((t-t0)/1300,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)};
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add("in");io.unobserve(t);const n=$("[data-n]",t);if(n)count(n,+n.dataset.n)}),{threshold:.12});
  $$(".rv:not(.in)").forEach(el=>RM?(el.classList.add("in"),$("[data-n]",el)&&($("[data-n]",el).textContent=$("[data-n]",el).dataset.n)):io.observe(el));
}
// Constellation interactive : légère, en pause quand elle n'est pas visible.
function fx(){
  const c=$("#fx");if(!c||RM)return;
  const x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,1.5);let w,h,P=[],vis=true,mx=-999,my=-999;
  const size=()=>{const r=c.parentNode.getBoundingClientRect();w=c.width=r.width*d;h=c.height=r.height*d;
    P=Array.from({length:innerWidth<700?30:60},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35*d,vy:(Math.random()-.5)*.35*d}))};
  size();addEventListener("resize",size);
  c.parentNode.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*d;my=(e.clientY-r.top)*d});
  new IntersectionObserver(e=>vis=e[0].isIntersecting).observe(c);
  (function loop(){
    if(!c.isConnected)return;requestAnimationFrame(loop);if(!vis||document.hidden)return;
    x.clearRect(0,0,w,h);const L=150*d;
    for(const p of P){p.x=(p.x+p.vx+w)%w;p.y=(p.y+p.vy+h)%h;
      x.fillStyle="#b9a6ff";x.globalAlpha=.7;x.fillRect(p.x,p.y,2*d,2*d);
      const dm=Math.hypot(p.x-mx,p.y-my);if(dm<L*1.4){x.strokeStyle="#35d8ff";x.globalAlpha=1-dm/(L*1.4);x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke()}}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const dd=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
      if(dd<L){x.strokeStyle="#8b5cf6";x.globalAlpha=(1-dd/L)*.35;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
  })();
}

/* ===== E. ROUTEUR ===== */
function render(){
  const h=location.hash.slice(1)||"accueil";
  let html,page=h,zone="",title="NEXORA ZONE – Gaming, animés et technologie",desc="NEXORA ZONE : guides, dossiers et découvertes sur le gaming, les animés et la technologie.";
  const art=h.startsWith("article-")&&A.find(a=>a.id===h.slice(8));
  if(art){html=articlePage(art);page="articles";zone=art.cat;title=art.t+" – NEXORA ZONE";desc=art.d}
  else if(Z[h]){html=zonePage(h);zone=h;title=Z[h].l+" – NEXORA ZONE";desc=Z[h].t}
  else if(h==="articles"){html=articlesPage();title="Articles – NEXORA ZONE";desc="Tous les articles de NEXORA ZONE : recherche et filtres par catégorie."}
  else if(h==="accueil"||!h.startsWith("article-")){html=home();page="accueil"}
  else{html=`<section class="page sec"><div class="wrap"><h1 class="big">Introuvable</h1><p class="sub" style="margin:16px 0 28px">Cet article n'existe pas.</p><a class="btn" href="#articles"><span>Voir les articles</span></a></div></section>`;page="articles"}
  root.dataset.z=zone;app.innerHTML=html;document.title=title;$("meta[name=description]").content=desc;
  const links=PAGES.map(([k,l])=>`<a href="#${k}"${k===page?' class="on" aria-current="page"':""}>${l}</a>`).join("");
  $("#nav").innerHTML=links;$("#fnav").innerHTML=links;closeMenu();
  if(h==="articles"){results();if(focusQ){$("#q").focus();focusQ=false}}
  reveal();fx();scrollTo(0,0);if(!focusQ)app.focus({preventScroll:true});
}
function go(){
  const cur=$("#cur");
  if(RM||!app.innerHTML){render();return}
  cur.classList.remove("go");void cur.offsetWidth;cur.classList.add("go");setTimeout(render,340);
}
function closeMenu(){$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false")}

/* ===== F. ÉVÉNEMENTS ===== */
addEventListener("hashchange",go);
$("#skip").onclick=()=>app.focus();
$("#sbtn").onclick=()=>{focusQ=true;if(location.hash==="#articles")$("#q").focus()};
$("#mb").onclick=e=>{const o=$("#nav").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o);e.currentTarget.setAttribute("aria-label",o?"Fermer le menu":"Ouvrir le menu")};
$("#up").onclick=()=>scrollTo({top:0,behavior:RM?"auto":"smooth"});
addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
app.addEventListener("input",e=>{if(e.target.id==="q"){query=e.target.value;results()}});
app.addEventListener("click",e=>{
  const f=e.target.closest("[data-f]");if(f){filter=f.dataset.f;results();return}
  const v=e.target.closest(".vt");if(v)openZone(v.parentNode);
  if(e.target.closest("#cp")){const b=$("#cp span");const ok=()=>{b.textContent="Lien copié";setTimeout(()=>b.textContent="Copier le lien",2000)};
    navigator.clipboard?navigator.clipboard.writeText(location.href).then(ok,()=>prompt("Copiez ce lien",location.href)):prompt("Copiez ce lien",location.href)}
});
function openZone(z){$$(".zone").forEach(o=>{const on=o===z;o.classList.toggle("open",on);$(".vt",o).setAttribute("aria-expanded",on)})}
app.addEventListener("mouseover",e=>{const z=FINE&&e.target.closest(".zone");if(z&&!z.classList.contains("open"))openZone(z)});
app.addEventListener("focusin",e=>{const z=e.target.closest(".zone");if(z&&!z.classList.contains("open"))openZone(z)});

// Pointeur : parallaxe du héros, inclinaison 3D des cartes, boutons magnétiques, curseur.
addEventListener("pointermove",e=>{
  if(!RM&&$("#hero")){root.style.setProperty("--mx",((e.clientX/innerWidth-.5)*2).toFixed(3));root.style.setProperty("--my",((e.clientY/innerHeight-.5)*2).toFixed(3))}
  if(!FINE||RM)return;
  const c=e.target.closest(".card");
  if(c){const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    c.style.setProperty("--ry",((px-.5)*9).toFixed(1)+"deg");c.style.setProperty("--rx",((.5-py)*9).toFixed(1)+"deg");c.style.setProperty("--gx",px*100+"%");c.style.setProperty("--gy",py*100+"%")}
  const b=e.target.closest(".btn");
  if(b){const r=b.getBoundingClientRect();b.style.translate=((e.clientX-r.left-r.width/2)*.18)+"px "+((e.clientY-r.top-r.height/2)*.28)+"px"}
});
document.addEventListener("pointerout",e=>{
  const c=e.target.closest&&e.target.closest(".card");if(c){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}
  const b=e.target.closest&&e.target.closest(".btn");if(b)b.style.translate="";
});
if(FINE&&!RM){
  const r=document.createElement("div");r.className="ring";r.setAttribute("aria-hidden","true");document.body.append(r);
  let tx=0,ty=0,x=0,y=0;
  addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;r.style.opacity=1});
  document.addEventListener("pointerover",e=>r.classList.toggle("big",!!e.target.closest("a,button,input,.zone")));
  document.addEventListener("mouseleave",()=>r.style.opacity=0);
  (function l(){x+=(tx-x)*.18;y+=(ty-y)*.18;r.style.transform=`translate3d(${x}px,${y}px,0)`;requestAnimationFrame(l)})();
}
// Défilement : parallaxe, barre de lecture, en-tête compact (un seul écouteur, une image par frame).
let tick=0;
addEventListener("scroll",()=>{if(tick)return;tick=1;requestAnimationFrame(()=>{
  tick=0;const y=scrollY;root.style.setProperty("--sy",Math.min(y,1200));$("#hdr").classList.toggle("sm",y>40);
  const p=$("#prog");if(p){const m=root.scrollHeight-innerHeight;p.style.transform=`scaleX(${m>0?y/m:0})`}})},{passive:true});

render();
</script>
</body>
